<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>综测计算工作台</title>
    <style>
      /* 首屏加载反馈：JS 产物下载解析期间显示品牌加载屏，React 挂载后随 #root 内容替换而消失 */
      #root .boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #1f2d3d;
      }
      #root .boot-box {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1677ff, #69b1ff);
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(22, 119, 255, 0.35);
      }
      #root .boot-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      #root .boot-bar {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: #e5e9f0;
        overflow: hidden;
      }
      #root .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #1677ff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      #root .boot-hint {
        font-size: 12px;
        color: #8492a6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-box">综</div>
        <div class="boot-title">综测计算工作台</div>
        <div class="boot-bar"></div>
        <div class="boot-hint">资源首次加载可能稍慢，请稍候…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
